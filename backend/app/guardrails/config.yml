# NeMo Guardrails config for the ONE untrusted-input path in this app: raw text scraped from a
# company's own careers/job-listing pages (app/agents/job_discovery_agent.py), before it's handed
# to the real extraction LLM in app/services/llm_client.py. Every other LLM call in this project
# only ever sees the candidate's own resume or the app's own generated text, which is trusted.
#
# Uses local Ollama (not OpenRouter/Gemini) for this check specifically, so it never competes
# with the app's already rate-limited free-tier extraction calls for quota.
models:
  - type: main
    engine: ollama
    model: mistral:7b
    parameters:
      base_url: http://localhost:11434/v1

rails:
  input:
    flows:
      - self check input
